server:
  # Стандартный порт Eureka; клиенты по умолчанию ищут сервер именно здесь
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    # Имя хоста, под которым сервер публикует себя в реестре.
    # Для локальной разработки достаточно localhost.
    hostname: localhost

  client:
    # ---------------------------------------------------------------------
    # SINGLE-NODE РЕЖИМ: сервер работает один, без кластера peer-серверов.
    #
    # По умолчанию Eureka-сервер ведёт себя КАК КЛИЕНТ самого себя:
    # регистрирует себя в реестре и скачивает реестр у "соседей".
    # Это нужно в кластере (peer-серверы реплицируют реестр друг другу),
    # но в single-node приводит к ошибкам "Cannot execute request on any
    # known server" и лишним записям в консоли.
    #
    # Обе настройки ниже отключают клиентское поведение сервера.
    # ---------------------------------------------------------------------
    register-with-eureka: false   # сервер не регистрирует сам себя
    fetch-registry: false         # сервер не скачивает реестр у соседей

  server:
    # ---------------------------------------------------------------------
    # SELF-PRESERVATION: защита реестра от сетевых сбоев.
    #
    # В production, если сервер перестаёт получать heartbeat более чем
    # от 15% инстансов, он ПРЕДПОЛАГАЕТ сетевой сбой (а не смерть сервисов)
    # и перестаёт удалять записи: лучше отдавать устаревшие адреса,
    # чем пустой реестр.
    #
    # В разработке это мешает: остановленный сервис висит в реестре
    # минутами, и gateway роутит запросы на мёртвый адрес.
    # Поэтому в dev-режиме защита отключается.
    # ---------------------------------------------------------------------
    enable-self-preservation: false

    # Периодичность вычистки протухших инстансов (мс).
    # Значение ниже дефолтных 60 секунд ускоряет очистку реестра в dev.
    eviction-interval-timer-in-ms: 15000